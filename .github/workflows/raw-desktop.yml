# Written with AI assistance (Codex). Artifacts only; no publication.
name: RAW desktop
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: xvfb-run --auto-servernum npm run smoke
        if: runner.os == 'Linux'
      - run: npm run smoke
        if: runner.os == 'Windows'
      - run: npm run dist:${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: xvfb-run --auto-servernum release/linux-unpacked/eva-sim --smoke
        if: runner.os == 'Linux'
      - run: '& "release/win-unpacked/EVA RAW.exe" --smoke'
        if: runner.os == 'Windows'
      - uses: actions/upload-artifact@v4
        with:
          name: raw-${{ matrix.target }}-x64
          path: |
            release/*.exe
            release/*.AppImage
          if-no-files-found: error
