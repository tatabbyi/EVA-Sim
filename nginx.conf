# Written with AI assistance (Claude). Owner: Nanda. Static hosting for the Vite build (see Dockerfile).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The 4 MB height grid, JSON and JS compress well.
  gzip on;
  gzip_min_length 1024;
  gzip_types application/octet-stream application/json application/javascript text/css image/svg+xml;

  # Build files have a content hash in their name and never change: cache for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Permissions-Policy "xr-spatial-tracking=(self)" always;
    try_files $uri =404;
  }

  # Everything else (index.html, grids, meta.json, later /.well-known/assetlinks.json): always revalidate.
  # A missing file is a real 404, never index.html: the terrain loader treats an HTML reply as "no grid".
  location / {
    add_header Cache-Control "no-cache";
    add_header Permissions-Policy "xr-spatial-tracking=(self)" always; # WebXR (headset) on this site
    try_files $uri $uri/ =404;
  }
}
